<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Rive 中文文档</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://jsd.cdn.zzko.cn/npm/docsify@4.13.1/lib/themes/vue.css">
</head>

<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'Rive 中文文档',
      repo: '',
      loadNavbar: true,     // 开启顶部导航
      loadSidebar: true,    // 开启侧边栏
      auto2top: true,       // 切换页面后自动回到顶部
      subMaxLevel: 3,       // 目录层级
      sidebarDisplayLevel: 1,
      // 路由别名配置：所有子目录统一使用根目录的侧边栏
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
      },
      sidebarCollapse: {
        accordion: true,
        open: false
      },
      search: {
        placeholder: '搜索文档',
        noData: '找不到结果',
        depth: 3
      }
    }
  </script>
  <script src="https://jsd.cdn.zzko.cn/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://jsd.cdn.zzko.cn/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script
    src="https://jsd.cdn.zzko.cn/npm/docsify-sidebar-collapse@1.3.5/dist/docsify-sidebar-collapse.min.js"></script>
</body>

</html>
