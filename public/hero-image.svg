<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  
  <!-- Outer glowing aura -->
  <circle cx="200" cy="200" r="120" fill="url(#glow)" filter="url(#blur)" opacity="0.6" />
  
  <!-- Sleek central R-like shape -->
  <path d="M 160 120 C 220 120, 260 140, 260 190 C 260 220, 240 240, 200 250 L 250 300 L 200 300 L 160 250 L 160 300 L 120 300 L 120 120 Z" fill="url(#glow)" />
  <path d="M 160 160 L 160 210 C 190 210, 210 200, 210 185 C 210 170, 190 160, 160 160 Z" fill="#0f172a" />
  
  <!-- Gloss reflection -->
  <path d="M 130 130 C 180 130, 240 145, 240 185 C 240 160, 200 140, 150 140 Z" fill="#ffffff" opacity="0.4" />
</svg>
